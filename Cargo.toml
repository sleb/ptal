[package]
name = "ptal"
version = "0.3.1"
edition = "2024"
rust-version = "1.89"
description = "Terminal tool for reviewing a single throwaway text file: comment in a TUI, resolve through a JSON CLI for agents."
license = "MIT"
repository = "https://github.com/sleb/ptal"
readme = "README.md"
keywords = ["tui", "review", "markdown", "comments", "agents"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**", "/tests/cli.rs", "/tests/core.rs", "/tests/panic_hook.rs", "/tests/tui.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/skills/**"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
similar = { version = "3.2", default-features = false, features = ["std"] }
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
format_push_string = "warn"
redundant_clone = "warn"
unnecessary_wraps = "warn"
map_unwrap_or = "warn"
semicolon_if_nothing_returned = "warn"
unnested_or_patterns = "warn"
redundant_closure_for_method_calls = "warn"
implicit_clone = "warn"
cloned_instead_of_copied = "warn"
manual_let_else = "warn"
