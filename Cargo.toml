[package]
name = "ptal"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Terminal tool for reviewing a single throwaway text file: comment in a TUI, resolve through a JSON CLI for agents."
license = "MIT"
repository = "https://github.com/sleb/ptal"
readme = "README.md"
keywords = ["tui", "review", "markdown", "comments", "agents"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**", "/tests/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
