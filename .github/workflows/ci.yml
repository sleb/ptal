name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: fmt, clippy, test, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package --locked
      - name: Tarball holds no dev-only files
        run: |
          if cargo package --list --locked | grep -E '^(\.agents|\.claude|\.crit|scripts|skills-lock\.json|tests/docs\.rs)'; then
            echo "forbidden paths in the package" >&2
            exit 1
          fi
      - name: Docs build from the unpacked tarball
        run: |
          ver=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          cargo doc --no-deps --manifest-path "target/package/ptal-$ver/Cargo.toml"
        env:
          RUSTDOCFLAGS: -D warnings
